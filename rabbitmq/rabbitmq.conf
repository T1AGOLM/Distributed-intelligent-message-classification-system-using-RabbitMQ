# RabbitMQ configuration — Distributed Intelligent Message Classification System
# Mounted at /etc/rabbitmq/rabbitmq.conf by Docker Compose (see task 3).

# --- AMQP listener ---
listeners.tcp.default = 5672

# --- Management plugin (UI on http://localhost:15672) ---
management.listener.port = 15672
management.listener.ssl = false

# Allow the default guest user to connect from other containers on the
# Docker network (demo purposes only — do not use in production).
loopback_users = none

# --- Declarative topology: Topic Exchange, queues, bindings and DLQs ---
# Loaded on boot so the whole topology (exchange, queues, bindings, DLQs)
# is created automatically — no manual setup needed.
load_definitions = /etc/rabbitmq/definitions.json
